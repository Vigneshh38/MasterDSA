name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Add Android project
        run: npx cap add android
      - name: Use the logo as app icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp icons/$d/ic_launcher_round.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            cp icons/$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done
      - name: Sync web files
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PatternCoach-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PatternCoach.apk
          gh release create "v1.${{ github.run_number }}" PatternCoach.apk --title "Pattern Coach v1.${{ github.run_number }}" --notes "Install PatternCoach.apk on your Android phone."
