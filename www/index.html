oduct of all numbers to the right.", "analogy": "Like asking each person: \"multiply what the people on my left have, and what the people on my right have\".", "what": ["<b>Prefix<\/b> = everything before position i. <b>Suffix<\/b> = everything after position i. The answer is prefix x suffix.", "Using the output list for the prefix and one variable for the suffix gives O(1) extra space."], "gloss": [["Prefix", "Everything before an index."], ["Suffix", "Everything after an index."], ["Division trick", "Total / nums[i], which fails when a number is 0, so we avoid it."], ["Extra space", "Memory beyond the output."]], "when": ["Answer for each index uses everything else", "Cannot use division", "Prefix/suffix sums or products"], "problems": "238. Product of Array Except Self", "time": ["O(n)", "Two passes."], "space": ["O(1)", "Not counting the output."], "mistakes": ["Using division (fails with zeros).", "Updating <code>right<\/code> before using it.", "Starting the left pass at 0 instead of 1."], "problem": "<b>Problem (LeetCode 238):<\/b> <code>nums = [1, 2, 3, 4]<\/code>. Return a list where each item is the product of all other items.", "code": "def product_except_self(nums):\n    n = len(nums)\n\n    ## 1. Left pass: out[i] = product of everything left of i\n    out = [1] * n\n    for i in range(1, n):\n        out[i] = out[i - 1] * nums[i - 1]\n\n    ## 2. Right pass: multiply by the product of everything right of i\n    right = 1\n    for i in range(n - 1, -1, -1):\n        out[i] *= right\n        right *= nums[i]\n\n    return out\n\n\nprint(product_except_self([1, 2, 3, 4]))   # [24, 12, 8, 6]", "task": "Product of everything except yourself, no division", "steps": [{"t": "Setup", "e": "For each position, multiply all numbers except itself, without division. Plan: first fill each cell with the product of everything to its <b>left<\/b> (prefix), then multiply by the product of everything to its <b>right<\/b> (suffix).", "v": "out = [1, 1, 1, 1]", "rows": [{"l }, {"label": "out", "arr": [1, 1, 8, 6], "p": {}, "hl": [], "ok": [2], "dim": [], "note": "", "bad": []}]}, {"t": "Right pass: i = 1", "e": "Multiply out[1] by the product on the right (12): out[1] = <b>12<\/b>. Then right = 12 x 2 = 24.", "v": "out = [1, 12, 8, 6], right = 24", "rows": [{"label": "nums", "arr": [1, 2, 3, 4], "p": {}, "hl": [1], "ok": [], "dim": [], "note": "", "bad": []}, {"label": "out", "arr": [1, 12, 8, 6], "p": {}, "hl": [], "ok": [1], "dim": [], "note": "", "bad": []}]}, {"t": "Right pass: i = 0", "e": "Multiply out[0] by the product on the right (24): out[0] = <b>24<\/b>. Then right = 24 x 1 = 24.", "v": "out = [24, 12, 8, 6], right = 24", "rows": [{"label": "nums", "arr": [1, 2, 3, 4], "p": {}, "hl": [0], "ok": [], "dim": [], "note": "", "bad": []}, {"label": "out", "arr": [24, 12, 8, 6], "p": {}, "hl": [], "ok": [0], "dim": [], "note": "", "bad": []}]}], "starter": "# Pattern 79: Array: Prefix and Suffix Products\n# Product of everything except yourself, no division\ndef product_except_self(nums):\n    # write your solution here\n    pass\n\n"}, {"n": 80, "sec": "Array / Matrix", "short": "Plus One / Digits", "icon": "➕1", "name": "Array: Digit Arithmetic", "sub": "Add to a number stored as a list of digits", "idea": "Go from the last digit to the first. A 9 turns into 0 and carries on. The first digit below 9 gets +1 and you return. If all digits were 9, put a 1 in front.", "analogy": "Like an old odometer: when 9 rolls over to 0, the next wheel turns by one.", "what": ["The carry stops as soon as a digit is below 9, so most of the time only the last digit changes.", "All 9s (like 999) produce a longer list: [1, 0, 0, 0]."], "gloss": [["Digit", "One of 0 to 9."], ["Carry", "The extra 1 passed to the next digit."], ["Odometer", "A counter with wheels that roll over."], ["Edge case", "A rare special input such as all 9s."]], "when": ["Add to a big number in a list", "Increment a counter", "Multiply strings (next patterns)"], "problems": "66. Plus One", "time": ["O(n)", "Worst case all 9s."], "space": ["O(1)", "In place (O(n) only for all 9s)."], "mistakes": ["Converting to int and back (fails on very long numbers).", "Forgetting the all-9s case.", "Not returning right after the first digit below 9."], "problem": "<b>Problem (LeetCode 66):<\/b> <code>digits = [1, 9, 9]<\/code> (the number 199). Add one and return the digits.", "code": "def plus_one(digits):\n    ## 1. Go from the last digit to the first\n    for i in range(len(digits) - 1, -1, -1):\n        ## 2. Below 9: add 1 and we are done\n        if digits[i] < 9:\n            digits[i] += 1\n            return digits\n        ## 3. A 9 becomes 0 and carries on\n        digits[i] = 0\n\n    ## 4. Every digit was 9: add a leading 1\n    return [1] + digits\n\n\nprint(plus_one([1, 9, 9]))   # [2, 0, 0]", "task": "Add to a number stored as a list of digits", "steps": [{"t": "Setup", "e": "The digits of 199 are stored in a list. Add 1 starting from the <b>last digit<\/b>. A 9 becomes 0 and the carry moves left. A digit smaller than 9 just goes up by 1 and we are done.", "v": "digits = [1, 9, 9]", "rows": [{"label": "digits", "arr": [1, 9, 9], "p": {}, "hl": [], "ok": [], "dim": [], "note": "", "bad": []}]}, {"t": "Index 2: digit is 9", "e": "A 9 plus 1 is 10, so write <b>0<\/b> and carry 1 to the left.", "v": "digits = [1, 9, 0]", "rows": [{"label": "digits", "arr": [1, 9, 0], "p": {}, "hl": [2], "ok": [], "dim": [], "note": "", "bad": []}]}, {"t": "Index 1: digit is 9", "e": "A 9 plus 1 is 10, so write <b>0<\/b> and carry 1 to the left.", "v": "digits = [1, 0, 0]", "rows": [{"label": "digits", "arr": [1, 0, 0], "p": {}, "hl": [1], "ok": [], "dim": [], "note": "", "bad": []}]}, {"t": "Index 0: digit is less than 9", "e": "The digit is not 9, so add 1: it becomes <b>2<\/b>. No carry is left, return the list.", "v": "digits = [2, 0, 0]", "rows": [{"label": "digits", "arr": [2, 0, 0], "p": {}, "hl": [], "ok": [0], "dim": [], "note": "", "bad": []}]}], "starter": "# Pattern 80: Array: Digit Arithmetic\n# Add to a number stored as a list of digits\ndef plus_one(digits):\n    # write your solution here\n    pass\n\n"}, {"n": 81, "sec": "Array / Matrix", "short": "Merge Sorted Array (from the end)", "icon": "⇇", "name": "Array: Merging Sorted Arrays In Place", "sub": "Fill from the back so nothing gets overwritten", "idea": "Put three pointers at the ends: i (last real item of the first array), j (last item of the second) and k (the last slot). Write the bigger of the two items at k and move back.", "analogy": "Like parking cars in a lot from the far end so you never block spaces you still need.", "what": ["The empty space is at the back, so writing from the back never overwrites an item we have not used yet.", "When b is finished, a's remaining items are already in the right place."], "gloss": [["In place", "Use the same array for the result."], ["Pointer", "An index that points at a position."], ["Overwrite", "Replace a value so that it is lost."], ["Sorted", "Arranged small to big."]], "when": ["Merge into an array with spare room at the end", "Combine two sorted lists without extra memory", "Fill from the back"], "problems": "88. Merge Sorted Array", "time": ["O(m + n)", "One pass."], "space": ["O(1)", "Three indexes."], "mistakes": ["Filling from the front (overwrites data).", "Looping while i >= 0 instead of j >= 0.", "Forgetting that i can run below 0."], "problem": "<b>Problem (LeetCode 88):<\/b> <code>nums1 = [1,2,3,0,0,0]<\/code> (m = 3), <code>nums2 = [2,5,6]<\/code> (n = 3). Merge nums2 into nums1 in sorted order.", "code": "def merge(nums1, m, nums2, n):\n    ## 1. Setup: last real item of each array, and the last slot\n    i, j, k = m - 1, n - 1, m + n - 1\n\n    ## 2. Fill from the back with the bigger item\n    while j >= 0:\n        if i >= 0 and nums1[i] > nums2[j]:\n            nums1[k] = nums1[i]\n            i -= 1\n        else:\n            nums1[k] = nums2[j]\n            j -= 1\n        k -= 1\ ared in an Array", "time": ["O(n)", "Each swap puts one number in place for good."], "space": ["O(1)", "In place."], "mistakes": ["Moving <code>i<\/code> after a swap (the new number is not checked).", "Infinite loop with duplicates: check <code>nums[j] != nums[i]<\/code>.", "Not ignoring numbers outside 1..n."], "problem": "<b>Problem (LeetCode 41):<\/b> <code>nums = [3, 4, -1, 1]<\/code>. Find the smallest missing positive integer.", "code": "def first_missing_positive(nums):\n    n = len(nums)\n    i = 0\n\n    ## 1. Send every number x (1..n) to index x - 1\n    while i < n:\n        j = nums[i] - 1               # where nums[i] belongs\n        if 0 <= j < n and nums[j] != nums[i]:\n            nums[i], nums[j] = nums[j], nums[i]\n        else:\n            i += 1\n\n    ## 2. The first wrong place shows the missing number\n    for i in range(n):\n        if nums[i] != i + 1:\n            return i + 1\n\n    return n + 1\n\n\nprint(first_missing_positive([3, 4, -1, 1]))   # 2", "task": "Put each number at its own index to find missing or duplicate numbers", "steps": [{"t": "Setup", "e": "Find the smallest missing positive number. The answer is between 1 and n + 1. Idea: put every number x (1 to n) at index x - 1. Then the first index where nums[i] ≠ i + 1 shows the missing number.", "v": "i = 0", "rows": [{"label": "nums", "arr": [3, 4, -1, 1], "p": {"i": 0}, "hl": [], "ok": [], "dim": [], "note": "", "bad": []}]}, {"t": "Swap index 0 with index 2", "e": "nums[0] = 3 belongs at index 2, and the number there (-1) is different. Swap them. Stay at index 0 because a new number arrived.", "v": "swapping", "rows": [{"label": "nums", "arr": [3, 4, -1, 1], "p": {"i": 0}, "hl": [0, 2], "ok": [], "dim": [], "note": "", "bad": []}]}, {"t": "After the swap", "e": "The array is now [-1, 4, 3, 1].", "v": "nums = [-1, 4, 3, 1]", "rows": [{"label": "nums", "arr": [-1, 4, 3, 1], "p": {"i": 0}, "hl": [], "ok": [2], "dim": [], "note": "", "bad": []}]}, {"t": "Move on from index 0 r": [1, -1, 3, 4], "p": {"i": 3}, "hl": [], "ok": [], "dim": [3], "note": "", "bad": []}]}, {"t": "Scan for the first wrong place", "e": "Look for the first index where nums[i] ≠ i + 1. Index 1 holds -1 but should hold 2. So the missing number is <b>2<\/b>.", "v": "answer = 2", "rows": [{"label": "nums", "arr": [1, -1, 3, 4], "p": {}, "hl": [], "ok": [0], "dim": [], "note": "", "bad": [1]}]}], "starter": "# Pattern 82: Array: Cyclic Sort (Index as Hash)\n# Put each number at its own index to find missing or duplicate numbers\ndef first_missing_positive(nums):\n    # write your solution here\n    pass\n\n"}, {"n": 83, "sec": "Array / Matrix", "short": "Max Product Subarray", "icon": "✖✖", "name": "Array: Maximum Product Subarray (Track Max and Min)", "sub": "Best product when negatives can flip signs", "idea": "Track the biggest and the smallest product that end at the current number. A negative number swaps their roles. Update both with 3 candidates each step.", "analogy": "Like a seesaw: a negative number tips the lowest value to the top.", "what": ["Two negatives multiply to a positive, so the smallest (most negative) product can become the largest later.", "Each step, the 3 candidates are: the number alone, cur_max x number, cur_min x number."], "gloss": [["Subarray", "A continuous part of a list."], ["cur_max / cur_min", "Largest / smallest product of a subarray ending at the current number."], ["Sign flip", "A negative number turns big into small and small into big."], ["Tuple", "A fixed group of values like (a, b, c)."]], "when": ["Maximum product of a subarray", "Running best and worst values", "Negatives or zeros change the rule"], "problems": "152. Maximum Product Subarray", "time": ["O(n)", "One pass."], "space": ["O(1)", "Three variables."], "mistakes": ["Tracking only the maximum.", "Updating cur_max before using the old value for cur_min.", "Ignoring zeros (a zero resets both through the \"x alone\" candidate)."], "problem": "<b>Problem (LeetCode 152):<\/b> <code>nums = [2, 3, -2, 4]<\/code>. Find the largest product of a continuous subarray.", "code": "def max_product(nums):\n    ## 1. Setup\n    cur_max = cur_min = best = nums[0]\n\n    for x in nums[1:]:\n        ## 2. Three candidates: x alone, or extend either extreme\n        candidates = (x, cur_max * x, cur_min * x)\n        cur_max = max(candidates)\n        cur_min = min(candidates)\n\n        ## 3. Track the best product seen\n        best = max(best, cur_max)\n\n    return best\n\n\nprint(max_product([2, 3, -2, 4]))   # 6", "task": "Best product when negatives can flip signs", "steps": [{"t": "Setup", "e": "A negative number can flip the smallest product into the biggest. So track <b>both<\/b> the biggest product ending here (<code>cur_max<\/code>) and the smallest (<code>cur_min<\/code>).", "v": "cur_max=2, cur_min=2, best=2", "rows": [{"label": "nums", "arr": [2, 3, -2, 4], "p": {"i": 0}, "hl": [], "ok": [0], "dim": [], "note": "", "bad": []}]}, {"t": "i = 1, number 3", "e": "Candidates: 3 alone, cur_max x 3, cur_min x 3 = (3, 6, 6). New cur_max = <b>6<\/b>, new cur_min = <b>3<\/b>. best = <b>6<\/b>.", "v": "cur_max=6, cur_min=3, best=6", "rows": [{"label": "nums", "arr": [2, 3, -2, 4], "p": {"i": 1}, "hl": [1], "ok": [0], "dim": [], "note": "", "bad": []}]}, {"t": "i = 2, number -2", "e": "Candidates: -2 alone, cur_max x -2, cur_min x -2 = (-2, -12, -6). New cur_max = <b>-2<\/b>, new cur_min = <b>-12<\/b>. best = <b>6<\/b>.", "v": "cur_max=-2, cur_min=-12, best=6", "rows": [{"label": "nums", "arr": [2, 3, -2, 4], "p": {"i": 2}, "hl": [2], "ok": [0, 1], "dim": [], "note": "", "bad": []}]}, {"t": "i = 3, number 4", "e": "Candidates: 4 alone, cur_max x 4, cur_min x 4 = (4, -8, -48). New cur_max = <b>4<\/b>, new cur_min = <b>-48<\/b>. best = <b>6<\/b>.", "v": "cur_max=4, cur_min=-48, best=6", "rows": [{"label": "nums", "arr": [2, 3, -2, 4], "p": {"i": 3}, "hl": [3], "ok": [0, 1, 2], "dim": [], "note": "", "bad": []}]}, {"t": "Done", "e": "The best product is <b>6<\/b> (from [2, 3]).", "v": "answer = 6", "rows": [{"label": "nums", "arr": [2, 3, -2, 4], "p": {}, "hl": [], "ok": [0, 1], "dim": [], "note": "", "bad": []}]}], "starter": "# Pattern 83: Array: Maximum Product Subarray (Track Max and Min)\n# Best product when negatives can flip signs\ndef max_product(nums):\n    # write your solution here\n    pass\n\n"}, {"n": 84, "sec": "Strings", "short": "Palindrome Check", "icon": "🪞", "name": "String: Palindrome Check (Two Pointers / Reverse)", "sub": "Check if a string reads the same both ways", "idea": "Put one pointer at each end and move inward. If the letters differ, the string is not a palindrome (or, for Valid Palindrome II, you try skipping one letter on either side).", "analogy": "Like checking if a word is symmetric by comparing the first and last letters, then the second and second-last.", "what": ["A <b>palindrome<\/b> reads the same forwards and backwards, like \"level\".", "The easy way is <code>s == s[::-1]<\/code>. The two-pointer way uses O(1) extra memory and lets you handle \"one mistake allowed\"."], "gloss": [["Palindrome", "The same forwards and backwards."], ["Two pointers", "One index at each end, moving toward the middle."], ["Slice [::-1]", "Python trick that reverses a string."], ["Helper", "A small function used inside another function."]], "when": ["Palindrome checks", "Palindrome with one deletion", "Ignore spaces and symbols"], "problems": "9. Palindrome Number, 125. Valid Palindrome, 680. Valid Palindrome II", "time": ["O(n)", "Each letter is compared at most twice."], "space": ["O(1)", "Only two pointers."], "mistakes": ["Forgetting to skip non-letters (in Valid Palindrome).", "Trying both skips and forgetting one of them.", "Not handling an empty or one-letter string."], "problem": "<b>Problem (LeetCode 680):<\/b> <code>s = \"abca\"<\/code>. Can it become a palindrome after deleting at most one character?", "code": "def valid_palindrome(s):\n    ## 1. Helper: is s[l..r] a palindrome?\n    def is_pal(l, r):\n        while l < r:\n            if s[l] != s[r]:\n                return False\n            l += 1\n            r -= 1\n        return True\n\n    ## 2. Two pointers from both ends\n    l, r = 0, len(s) - 1\n    while l < r:\n        ## 3. Mismatch: try skipping the left or the right letter\n        if s[l] != s[r]:\n            return is_pal(l + 1, r) or is_pal(l, r - 1)\n        l += 1\n        r -= 1\n\n    return True\n\n\nprint(valid_palindrome(\"abca\"))   # True", "task": "Check if a string reads the same both ways", "steps": [{"t": "Setup", "e": "A palindrome reads the same backwards. We may delete <b>at most one<\/b> letter. Two pointers start at both ends and move inward while the letters match.", "v": "l = 0, r = 3", "rows": [{"label": "s", "arr": ["a", "b", "c", "a"], "p": {"l": 0, "r": 3}, "hl": [], "ok": [], "dim": [], "note": "", "bad": []}]}, {"t": "Compare s[0] and s[3]", "e": "\"a\" = \"a\", so they match. Move both inward: l = 1, r = 2.", "v": "l = 1, r = 2", "rows": [{"label": "s", "arr": ["a", "b", "c", "a"], "p": {"l": 0, "r": 3}, "hl": [], "ok": [0, 3], "dim": [], "note": "", "bad": []}]}, {"t": "Compare s[1] and s[2]", "e": "\"b\" ≠ \"c\": a mismatch. We may delete one letter, so we have two choices: skip the left letter (check s[2..2]) or skip the right letter (check s[1..1]).", "v": "mismatch at l = 1, r = 2", "rows": [{"label": "s", "arr": ["a", "b", "c", "a"], "p": {"l": 1, "r": 2}, "hl": [], "ok": [0, 3], "dim": [], "note": "", "bad": [1, 2]}]}, {"t": "Try skipping s[1] = \"b\"", "e": "Check the piece from index 2 to 2: \"c\". A single letter is a palindrome ✔. So the whole string works with one deletion. Answer: <b>True<\/b>.", "v": "answer = True", "rows": [{"label": "s", "arr": ["a", "b", "c", "a"], "p": {}, "hl": [], "ok": [0, 2, 3], "dim": [1], "note": "", "bad": []}]}], "starter": "# Pattern 84: String: Palindrome Check (Two Pointers / Reverse)\n# Check if a string reads the same both ways\ndef valid_pal  sign = 1\n    if i < n and s[i] in \"+-\":\n        sign = -1 if s[i] == \"-\" else 1\n        i += 1\n\n    ## 3. Read digits until a non-digit\n    num = 0\n    while i < n and s[i].isdigit():\n        num = num * 10 + int(s[i])\n        i += 1\n\n    ## 4. Apply the sign and clamp to 32 bits\n    num *= sign\n    return max(-2 ** 31, min(2 ** 31 - 1, num))\n\n\nprint(my_atoi(\"  -42abc\"))   # -42", "task": "Parse a number from messy text safely", "steps": [{"t": "Setup", "e": "Convert text to a number step by step: 1) skip spaces, 2) read an optional sign, 3) read digits until a non-digit, 4) apply the sign, 5) clamp to the 32-bit range.", "v": "i = 0", "rows": [{"label": "s", "arr": [" ", " ", "-", "4", "2", "a", "b", "c"], "p": {"i": 0}, "hl": [], "ok": [], "dim": [], "note": "", "bad": []}]}, {"t": "Skip spaces", "e": "The first 2 characters are spaces. Move i to 2.", "v": "i = 2", "rows": [{"label": "s", "arr": [" ", " ", "-", "4", "2", "a", "b", "c"], "p": {"i": 2}, "hl": [2], "ok": [], "dim": [0, 1], "note": "", "bad": []}]}, {"t": "Read the sign", "e": "\"-\" is a sign, so sign = -1. Move to the next character.", "v": "sign = -1", "rows": [{"label": "s", "arr": [" ", " ", "-", "4", "2", "a", "b", "c"], "p": {"i": 2}, "hl": [], "ok": [2], "dim": [], "note": "", "bad": []}]}, {"t": "Digit \"4\"", "e": "num = num x 10 + 4 = <b>4<\/b>.", "v": "num = 4", "rows": [{"label": "s", "arr": [" ", " ", "-", "4", "2", "a", "b", "c"], "p": {"i": 3}, "hl": [], "ok": [3], "dim": [], "note": "", "bad": []}]}, {"t": "Digit \"2\"", "e": "num = num x 10 + 2 = <b>42<\/b>.", "v": "num = 42", "rows": [{"label": "s", "arr": [" ", " ", "-", "4", "2", "a", "b", "c"], "p": {"i": 4}, "hl": [], "ok": [4], "dim": [], "note": "", "bad": []}]}, {"t": "Stop at a non-digit", "e": "\"a\" is not a digit, so reading stops. num = 42.", "v": "num = 42", "rows": [{"label": "s", "arr": [" ", " ", "-", "4", "2", "a", "b", "c"], "p": {"i": 5}, "hl": [], "ok": [], "dim": [], "note": "", "bad": [5] e the string, remove the first and last letters, and check whether the original appears inside what is left.", "analogy": "Like a wallpaper pattern: if you slide the roll over itself by one piece, the pattern matches again.", "what": ["If s = piece repeated k times, then s + s contains s starting at the position of the piece length. Removing the first and last letters hides the matches at 0 and at len(s).", "So s appears in the middle only when the string is made of repeats."], "gloss": [["Substring", "A continuous part of a string."], ["Repeat", "The same piece written again and again."], ["s in t", "Python test: is s inside t?"], ["Rotation", "Moving letters from the front to the back."]], "when": ["Is a string made of a repeated piece?", "Is one string a rotation of another?", "Pattern in a string"], "problems": "459. Repeated Substring Pattern", "time": ["O(n)", "The search for s in the doubled string (with a good algorithm)."], "space": ["O(n)", "The doubled string."], "mistakes": ["Not removing the first and last letters (the test is then always True).", "Using this for a single-letter string.", "Thinking the piece must be found by looping over every length (works, but slower)."], "problem": "<b>Problem (LeetCode 459):<\/b> <code>s = \"abcabc\"<\/code>. Can s be built by repeating a substring?", "code": "def repeated_substring_pattern(s):\n    ## 1. Glue s to itself, remove the first and last letter\n    doubled = (s + s)[1:-1]\n\n    ## 2. If s still appears, s is made of repeats\n    return s in doubled\n\n\nprint(repeated_substring_pattern(\"abcabc\"))   # True", "task": "Is the string built from one piece repeated?", "steps": [{"t": "Setup", "e": "Can the string be made by repeating a smaller piece? Trick: glue the string to itself. If s is made of repeats, then s will show up inside the glued string <b>somewhere other than the very start and the very end<\/b>.", "v": "s = \"abcabc\"", "rows": [{"label": "s", "arr": ["a", "b", "c", "a", "b", "c"], "p": {}, "hl": [], "ok": [], "dim": [], "note": "", "bad": []}]}, {"t": "Double the string", "e": "s + s = \"abcabcabcabc\".", "v": "doubled = \"abcabcabcabc\"", "rows": [{"label": "s + s", "arr": ["a", "b", "c", "a", "b", "c", "a", "b", "c", "a", "b", "c"], "p": {}, "hl": [6, 7, 8, 9, 10, 11], "ok": [0, 1, 2, 3, 4, 5], "dim": [], "note": "", "bad": []}]}, {"t": "Remove the first and last letter", "e": "Cut off the first and last letters so that the two \"trivial\" copies of s at both ends are gone: \"bcabcabcab\".", "v": "middle = \"bcabcabcab\"", "rows": [{"label": "(s + s)[1:-1]", "arr": ["b", "c", "a", "b", "c", "a", "b", "c", "a", "b"], "p": {}, "hl": [], "ok": [], "dim": [], "note": "", "bad": []}]}, {"t": "Search for s", "e": "\"abcabc\" appears inside \"bcabcabcab\" at index 2. That means s is built from repeats (here \"abc\" twice). Answer: <b>True<\/b>.", "v": "answer = True", "rows": [{"label": "(s + s)[1:-1]", "arr": ["b", "c", "a", "b", "c", "a", "b", "c", "a", "b"], "p": {}, "hl": [], "ok": [2, 3, 4, 5, 6, 7], "dim": [], "note": "", "bad": []}]}], "starter": "# Pattern 90: String: Repeated Substring Pattern Detection\n# Is the string built from one piece repeated?\ndef repeated_substring_pattern(s):\n    # write your solution here\n    pass\n\n"}, {"n": 91, "sec": "Design", "short": "LRU Cache & Design", "icon": "🏗", "name": "Design: Data Structure Design (LRU Cache)", "sub": "Combine simple structures to get a fast new one", "idea": "Pick the basic structures that give the speed you need (a hash map for lookup, an ordered list for recency) and combine them in a class.", "analogy": "Like a desk with space for two books: when you open a third, you put the least recently used book back on the shelf.", "what": ["Design problems ask for a class with methods and speed rules. First list the operations, then choose structures that make each one O(1).", "<b>LRU<\/b> = Least Recently Used. The item that was used longest ago is removed first."], "gloss": [["Cache", "Fas function pcol(n){
  n = n.toLowerCase();
  if (['l','left','slow','write','i','s','lo','pa','l1','prev','start','top','low','cut i'].includes(n)) return 'background:#000;color:#fff;border:1.5px solid #000';
  if (['r','right','fast','read','j','hi','pb','l2','end','bottom','cut j','day'].includes(n)) return 'background:#fff;color:#000;border:1.5px solid #000';
  return 'background:#555;color:#fff;border:1.5px solid #555';
}
function treeRow(r){
  const t = r.tree; let lv = 0, idx = 0, html = '';
  while (idx < t.length) {
    const n = 1 << lv; let cells = '';
    for (let k = 0; k < n; k++) {
      const i = idx + k;
      if (i >= t.length || t[i] === null) { cells += '<div class="tn gap"><span></span></div>'; continue; }
      let cls = 'tn';
      if (r.hl.includes(i)) cls += ' hl';
      if (r.ok.includes(i)) cls += ' ok';
      if (r.dim.includes(i)) cls += ' dim';
      cells += `<div class="${cls}"><span>${esc(t[i])}</span></div>`;
    }
    html += `<div class="tlv">${cells}</div>`; idx += n; lv++;
  }
  return `<div class="rowlab">${esc(r.label)}</div><div class="tree">${html}</div>${r.note ? `<div class="note" style="margin:6px 0 8px">${esc(r.note)}</div>` : ''}`;
}
function vizRow(r){
  if (r.tree) return treeRow(r);
  const at = {};
  for (const [name, idx] of Object.entries(r.p || {})) (at[idx] = at[idx] || []).push(name);
  let cells = '';
  r.arr.forEach((v, i) => {
    let cls = 'cell';
    if (r.hl.includes(i)) cls += ' hl';
    if (r.ok.includes(i)) cls += ' ok';
    if (r.bad.includes(i)) cls += ' bad';
    if (r.dim.includes(i)) cls += ' dim';
    const tags = (at[i] || []).map(n => `<span style="${pcol(n)}">${esc(n)}</span>`).join('');
    cells += `<div class="${cls}">${tags ? `<div class="tags">${tags}</div>` : ''}${esc(v)}<div class="ix">${i}</div></div>`;
  });
  return `<div class="rowlab">${esc(r.label)}</div><div class="cells${r.arr.length > 8 ? ' dense' : ''}">${cells}</div>${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}`;
}
function stepCard(s, i){

    ${s.rows.map(vizRow).join('')}

}

const KWS = new Set(['def','class','return','if','elif','else','while','for','in','not','and','or','is','break','continue','pass','import','from','lambda']);

function hl2(code){
  const re = /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|([A-Za-z_]\w*)|(\d+)|([=!<>+\-*\/%&|^~]+)|([()\[\]{}:,.;])/g;
  let out = '', last = 0, m, prevWord = '';
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const t = m[0];
    if (m[1]) out += `<span class="t-p">${esc(t)}</span>`;
    else if (m[2]) out += `<span class="t-s">${esc(t)}</span>`;
    else if (m[3]) {
      const next = code[m.index + t.length], prevCh = code[m.index - 1];
      let cls = 't-v';
      if (KWS.has(t)) cls = 't-k';
      else if (prevWord === 'def' || prevWord === 'class') cls = 't-d';
      else if (CONSTS.has(t)) cls = 't-c';
      else if (BUILTINS.has(t) && next === '(') cls = 't-b';
      else if (next === '(') cls = 't-f';
      else if (prevCh !== '.' && PTR_A.has(t)) cls = 't-a';
      else if (prevCh !== '.' && PTR_B.has(t)) cls = 't-z';
      out += `<span class="${cls}">${esc(t)}</span>`;
      prevWord = t;
    }
    else if (m[4]) out += `<span class="t-n">${t}</span>`;
    else if (m[5]) out += `<span class="t-o">${esc(t)}</span>`;
    else out += `<span class="t-p">${esc(t)}</span>`;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
function splitComment(line){
  let q = null;

    const c = line[i];
    if (q) { if (c === '\\') { i++; continue; } if (c === q) q = null; }
    else if (c === '"' || c === "'") q = c;
    else if (c === '#') return [line.slice(0, i), line.slice(i)];
  }
  return [line, ''];
}
const BN_COL = ['#1d4ed8','#15803d','#c2570c','#be185d','#6d28d9','#0e7490'];
function codeHtml(code, showCm){
  let out = '', ln = 0, prevBlank = false;
  code.split('\n').forEach(raw => {
    if (!raw.trim()) { if (!prevBlank) out += '<div class="cl bl"></div>'; prevBlank = true; return; }
    prevBlank = false;
    const sp = raw.match(/^ */)[0].length, gw = sp * 0.5;
    const trimmed = raw.trim();

      const num = m ? m[1] : '•', label = m ? m[2] : trimmed.replace(/^#+\s*/, '');
      const col = BN_COL[((m ? +m[1] : 1) - 1) % BN_COL.length];
      out += `<div class="bn" style="--c:${col};margin-left:${gw}ch"><b>${num}</b>${esc(label)}</div>`;
      return;
    }
    const [cd, cm] = splitComment(raw);
    const guide = `<span class="gd" style="width:${gw}ch"></span>`;
    let codeDiv = '';
    if (cd.trim()) { ln++; codeDiv = `<div class="cl"><span class="ln">${ln}</span>${guide}<span class="tx">${hl2(cd.trim())}</span></div>`; }
    const cmDiv = (cm && showCm) ? `<div class="cm"><span class="ln"></span>${guide}<span class="tx">${esc(cm.trim())}</span></div>` : '';

}

let bsTimer, bsRepeat;
function stopBs(){ clearTimeout(bsTimer); clearInterval(bsRepeat); }
kb.addEventListener('mousedown', e => e.preventDefault());
kb.addEventListener('pointerdown', e => {
  longFired = false;
  const b = e.target.closest('[data-f="bs"]');
  if (b) { e.preventDefault(); backspace(); bsTimer = setTimeout(() => { bsRepeat = setInterval(backspace, 70); }, 420); return; }
  const w = e.target.closest('[data-w]');
  if (w && WT[w.dataset.w] && WT[w.dataset.w].v) { longFired = false; clearTimeout(longTimer); longTimer = setTimeout(() => showVars(w), 380); }
});
['pointerup','pointercancel','pointerleave'].forEach(ev => kb.addEventListener(ev, () => { stopBs(); clearTimeout(longTimer); }));
kb.addEventListener('contextmenu', e => e.preventDefault());
kb.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (longFired) { longFired = false; return; }
  if (b.dataset.w !== undefined) { applyWord(b.dataset.w); return; }
  if (b.dataset.ins !== undefined) { insert(b.dataset.ins, +b.dataset.back || 0); return; }
  if (b.dataset.k !== undefined) {
    let k = b.dataset.k;
    if (b.classList.contains('letter') && shift) { k = k.toUpperCase(); if (shift === 1) { shift = 0; buildKb(); } }
    insert(k); return;
  }
  const f = b.dataset.f;
  if (f === 'shift') {
    const now = Date.now();
    if (shift === 1 && now - lastShiftTap < 450) shift = 2; else if (shift === 0) shift = 1; else shift = 0;
    lastShiftTap = now; buildKb();
  }
  else if (f === 'hidekb') { kbHidden = true; updateKb(); }
  else if (f === 'snips') openSnips();
  else if (f === 'more') { smartOpen = !smartOpen; smartSig = ''; updateSmart(); }
  else if (f === 'layer') { layer = layer === 'abc' ? 'sym' : 'abc'; buildKb(); }
  else if (f === 'tab') insert('    ');
  else if (f === 'enter') enter();
  else if (f === 'left') moveH(-1);
  else if (f === 'right') moveH(1);
  else if (f === 'up') moveV(-1);
  else if (f === 'down') moveV(1);
});

/* ---------- run Python (works inside the OneDSA app) ---------- */
const STDIN = 'onedsa-stdin';
let pyW = null, runId = 0, runTimer = null, runStart = 0, running = false;
function killPy(){ if (pyW) { try { pyW.terminate(); } catch (e) {} pyW = null; } clearTimeout(runTimer); running = false; }
function runUI(){
  let sin = ''; try { sin = localStorage.getItem(STDIN) || ''; } catch (e) {}
  openSheet('Run Python',
    `<div id="runSt">Ready</div><pre class="py" id="runOut"></pre>
     <div class="rbtns"><button class="btn" id="runGo" style="margin-top:0">▶ Run again</button><button class="btn" id="runCopy" style="margin-top:0;background:#eee;color:#000">Copy output</button></div>
     <details style="margin-top:14px"><summary style="font-weight:800;font-size:15px">Input for input() (one line for each call)</summary><textarea id="runIn" placeholder="Example:\n5\n1 2 3 4 5" spellcheck="false">${esc(sin)}</textarea></details>`);
  $('#runGo').onclick = () => { if (running) { killPy(); setSt('Stopped'); $('#runGo').textContent = '▶ Run again'; } else startRun(); };
  $('#runCopy').onclick = () => copyText($('#runOut').textContent);
}
function setSt(t){ const s = $('#runSt'); if (s) s.textContent = t; }
function addOut(t){ const o = $('#runOut'); if (o) { o.textContent += t; o.scrollTop = o.scrollHeight; } }
function startRun(){
  const code = ed.value; if (!code.trim()) { toast('Write some code first'); return; }
  const inp = $('#runIn'); const stdin = inp ? inp.value : '';
  try { localStorage.setItem(STDIN, stdin); } catch (e) {}
  const o = $('#runOut'); if (o) o.textContent = '';
  killPy();
  const id = ++runId; running = true; runStart = 0;
  const g = $('#runGo'); if (g) g.textContent = '■ Stop';
  setSt('Starting…');
  const fail = msg => { if (id !== runId) return; killPy(); setSt('Cannot run here'); addOut(msg); const gg = $('#runGo'); if (gg) gg.textContent = '▶ Run again'; };
  try { pyW = new Worker('pyworker.js'); } catch (e) { fail('Python runs inside the OneDSA Android app.\nThis page cannot start it. Install the OneDSA APK to run your code.\n'); return; }
  pyW.onerror = () => fail('Python runs inside the OneDSA Android app.\nThis page cannot start it. Install the OneDSA APK to run your code.\n');
  pyW.onmessage = ev => {
    const m = ev.data; if (!m || m.id !== id) return;
    if (m.type === 'status') setSt(m.text);
    else if (m.type === 'running') {
      runStart = Date.now(); setSt('Running…');
      runTimer = setTimeout(() => { if (id !== runId) return; killPy(); setSt('Stopped after 10 seconds'); addOut('\n⏱ Stopped: the code ran for more than 10 seconds. Check for an endless loop.\n'); const gg = $('#runGo'); if (gg) gg.textContent = '▶ Run again'; }, 10000);
    }
    else if (m.type === 'out') addOut(m.text);
    else if (m.type === 'done') { clearTimeout(runTimer); running = false; setSt('Finished in ' + ((Date.now() - runStart) / 1000).toFixed(2) + ' s'); const gg = $('#runGo'); if (gg) gg.textContent = '▶ Run again'; }
    else if (m.type === 'err') { clearTimeout(runTimer); running = false; setSt('Error'); addOut(m.text); const gg = $('#runGo'); if (gg) gg.textContent = '▶ Run again'; }
  };
  pyW.postMessage({id, code, stdin});
}
$('#bRun').onclick = () => { runUI(); startRun(); };

/* ---------- init ---------- */
(function init(){
  let saved = '';
  try { saved = localStorage.getItem(STORE) || ''; } catch (e) {}
  ed.value = saved || '# Type your Python code here.\n# Tap "Blank" above to start from a pattern.\n\n';
  hist = [{v: ed.value, s: ed.value.length, e: ed.value.length}]; hi = 0;
  measure(); renderHome(); go('home');
  window.addEventListener('resize', measure);
})();
</script>
